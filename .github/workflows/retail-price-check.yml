name: Retail price check

on:
  workflow_dispatch:
  push:
    paths:
      - 'retail-sources.json'
      - 'scripts/check-retail.mjs'
      - '.github/workflows/retail-price-check.yml'
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

jobs:
  check-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Check retailer prices
        run: node scripts/check-retail.mjs

      - name: Commit updated cache
        run: |
          if git diff --quiet -- price-cache.json; then
            echo "No cache changes"
            exit 0
          fi
          git config user.name "Deal Hunter Bot"
          git config user.email "deal-hunter-bot@users.noreply.github.com"
          git add price-cache.json
          git commit -m "Update retail price cache"
          git push
